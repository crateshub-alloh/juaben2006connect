name: Deploy to cPanel via SSH

on:
  push:
    branches: [ main, master ]

jobs:
  ssh-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_DIR: ${{ secrets.SSH_DIR }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_DIR" ]; then
            echo "ERROR: Missing one or more SSH secrets."
            echo "Required: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_DIR"
            exit 1
          fi
          echo "SSH secrets present"

      - name: Install SSH tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssh-client rsync

      - name: Save SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            echo "Using SSH_PRIVATE_KEY_B64"
            printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          else
            echo "Using SSH_PRIVATE_KEY (fallback)"
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          echo "Key file size: $(wc -c < ~/.ssh/deploy_key) bytes"
          echo "Key first line: $(head -1 ~/.ssh/deploy_key)"
          echo "Key last line: $(tail -1 ~/.ssh/deploy_key)"
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "Key validation: OK" || echo "Key validation: FAILED"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test SSH connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_DIR: ${{ secrets.SSH_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "Testing SSH connection to ${SSH_USER}@${SSH_HOST}:${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} ${SSH_USER}@${SSH_HOST} "id; echo OK"

      - name: Deploy files via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_DIR: ${{ secrets.SSH_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [[ "$SSH_DIR" != */ ]]; then
            SSH_DIR="$SSH_DIR/"
          fi
          echo "Deploying to ssh://${SSH_USER}@${SSH_HOST}:${SSH_PORT:-22}${SSH_DIR}"
          rsync -avz --delete --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='vendor' --exclude='tests' --exclude='*.zip' --exclude='assets/uploads/*' -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" ./ "$SSH_USER@$SSH_HOST:$SSH_DIR"
