name: Deploy to cPanel via SSH

on:
  push:
    branches: [ main, master ]

jobs:
  ssh-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_DIR: ${{ secrets.SSH_DIR }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_DIR" ]; then
            echo "ERROR: Missing one or more SSH secrets."
            echo "Required: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_DIR"
            exit 1
          fi
          echo "SSH secrets present"

      - name: Install SSH tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssh-client rsync

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH host to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy files via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_DIR: ${{ secrets.SSH_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [[ "$SSH_DIR" != */ ]]; then
            SSH_DIR="$SSH_DIR/"
          fi
          echo "Deploying to ssh://${SSH_USER}@${SSH_HOST}:${SSH_PORT:-22}${SSH_DIR}"
          rsync -avz --delete --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='vendor' --exclude='tests' --exclude='*.zip' --exclude='assets/uploads/*' -e "ssh -p ${SSH_PORT:-22}" ./ "$SSH_USER@$SSH_HOST:$SSH_DIR"
