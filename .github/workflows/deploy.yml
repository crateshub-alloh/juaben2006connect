name: Deploy to cPanel via FTP

on:
  push:
    branches: [ main, master ]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER_DIR" ]; then
            echo "ERROR: One or more FTP secrets are missing."
            echo "Required: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR"
            exit 1
          fi
          echo "FTP secrets present"

      - name: Deploy via SFTP (lftp)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_DIR: ${{ secrets.SFTP_DIR }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASS" ] || [ -z "$SFTP_DIR" ]; then
            echo "ERROR: Missing one or more SFTP secrets. Required: SFTP_HOST, SFTP_USER, SFTP_PASS, SFTP_DIR"
            exit 1
          fi
          sudo apt-get update -y
          sudo apt-get install -y lftp
          # normalize directory to end with '/'
          if [[ "$SFTP_DIR" != */ ]]; then
            SFTP_DIR="$SFTP_DIR/"
          fi
          echo "Deploying to sftp://${SFTP_HOST}:${SFTP_PORT:-22}${SFTP_DIR}"
          # run mirror upload (reverse) while excluding uploads and dev files
          lftp -u "$SFTP_USER","$SFTP_PASS" -p "${SFTP_PORT:-22}" sftp://"$SFTP_HOST" -e "set ssl:verify-certificate false; mirror -R --parallel=4 --delete --verbose --exclude-glob .git* --exclude-glob .github/* --exclude-glob node_modules --exclude-glob vendor --exclude-glob tests --exclude-glob '*.zip' --exclude-glob 'assets/uploads/*' ./ '$SFTP_DIR' ; bye"
